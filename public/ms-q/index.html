.btn{font:700 clamp(28px,5vh,56px) Fredoka,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,var(--b),var(--a));border:0;border-radius:999px;padding:.4em 1.1em;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .1s;animation:pop 2.4s ease-in-out infinite}

@keyframes pop{50%{transform:scale(1.04)}}
.shake{animation:shk .5s}@keyframes shk{25%{transform:translateX(-14px) rotate(-3deg)}75%{transform:translateX(14px) rotate(3deg)}}
.bounce{animation:bnc .6s}@keyframes bnc{40%{transform:translateY(-40px) scale(1.2)}}
.spin{animation:spn .8s}@keyframes spn{to{transform:rotate(360deg)}}
footer{background:rgba(46,16,101,.9);color:#fff;text-align:center;padding:1vh 2vw;font-size:clamp(16px,2.4vh,28px);z-index:2}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:fixed;bottom:-80px;font-size:48px;opacity:.55;animation:fl linear forwards;pointer-events:none;z-index:0}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}

#boardwrap{position:relative;line-height:0}

#side{display:flex;flex-direction:column;gap:1.2vh;width:min(26vw,360px)}
#side .btn{font-size:26px;padding:10px 14px}
.card{background:#fff;color:#2e1065;border-radius:20px;padding:10px 16px;font-size:30px;font-weight:700;text-align:center;line-height:1.15}
.card.sm{font-size:22px;font-weight:500}
#start{position:absolute;inset:0;background:rgba(20,10,50,.94);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;line-height:1.2;text-align:center;padding:20px}
.big{font-size:60px;font-weight:800}
#vol{width:100%;height:30px}

let AC,mg,sg,mel,nb,nextT=0,stp=0,musicOn=true;const mf=m=>440*Math.pow(2,(m-69)/12);
const CH=[[50,53,57,60,64],[43,50,53,59,62],[48,52,59,62,67],[45,52,55,59,64]],PENT=[60,62,64,67,69,72,74,76];
const vol=()=>G('vol').value/100*.8;
function tone(f,t,dur,type,v,dest,att){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,type,fr,v){const s=AC.createBufferSource();s.buffer=nb;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fr;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random()*.4,dur+.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.15);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.3)}

function sched(){if(!AC||!musicOn)return;const spb=60/72/2;
 while(nextT<AC.currentTime+.3){const s=stp%32,ch=CH[(s/8|0)%4],t=nextT+(s%2?spb*.2:0),b=s%8;

  if(b===0||b===5)tone(mf(ch[0]),t,spb*3,'sine',.22);

  noise(t,.04,'highpass',7000,s%2?.025:.05);
  if(Math.random()<.32)tone(mf(PENT[Math.random()*8|0]),t,spb*2.6,'sine',.07,mel,.01);
  if(Math.random()<.4)noise(t+Math.random()*spb,.012,'highpass',3000,.05);
  stp++;nextT+=spb}}
