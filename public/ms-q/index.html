:root{--a:#7c3aed;--b:#ec4899;--c:#f59e0b;--ink:#2e1065}

.btn:hover{transform:scale(1.08) rotate(-2deg)}.btn:active{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}

footer{background:rgba(46,16,101,.9);color:#fff;text-align:center;padding:1vh 2vw;font-size:clamp(16px,2.4vh,28px);z-index:2}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:fixed;bottom:-80px;font-size:48px;opacity:.55;animation:fl linear forwards;pointer-events:none;z-index:0}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}

#o2w{position:absolute;left:12px;bottom:12px;width:40%;background:#000a;border:4px solid #fff;border-radius:16px;padding:4px 10px;color:#fff;font-weight:bold;font-size:24px}
#o2b{height:22px;border-radius:10px;background:#3f6;width:100%;transition:background .3s}
#msg,#quiz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000c;border-radius:20px;color:#fff;font-size:56px;font-weight:bold;text-align:center;gap:20px}
#qa{display:grid;grid-template-columns:1fr 1fr;gap:16px}

#row{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap;align-items:center}
#hint{color:#fff;font-size:24px;font-weight:bold}

<script>
/* ===== BLING KIT (keep! call these from your code) =====
 confetti(x?,y?)  burst of confetti      beep(freq?,ms?)   happy sound
 tune([notes])    play note list         floaty(['🦖','🎈']) emoji rise in background
 wiggle(el,'shake'|'bounce'|'spin')       say('text')       speech bubble toast
 Sparkle cursor trail is automatic; every .btn click auto-plays pop + confetti. */
const $=s=>document.querySelector(s), fx=$('#fx');
let _ac; function beep(f=660,ms=120,type='sine'){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=_ac.createOscillator(),g=_ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(_ac.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+ms/1000);o.stop(_ac.currentTime+ms/1000)}catch(e){}}
function tune(n=[523,659,784,1047]){n.forEach((f,i)=>setTimeout(()=>beep(f,180,'triangle'),i*130))}
function confetti(x=innerWidth/2,y=innerHeight/2,n=40){const C=['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899'];
  for(let i=0;i<n;i++){const d=document.createElement('div'),a=Math.random()*6.28,v=150+Math.random()*350;
    d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:12px;height:18px;background:${C[i%6]};border-radius:3px`;fx.appendChild(d);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+300}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1200+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove()}}
function floaty(list=['⭐','🎈','🌈','🦋']){setInterval(()=>{const e=document.createElement('div');e.className='float';e.textContent=list[Math.random()*list.length|0];
  e.style.left=Math.random()*95+'vw';e.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),14000)},900)}
function wiggle(el,c='shake'){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),900)}
function say(t,ms=2500){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14vh;left:50%;transform:translateX(-50%);background:#fff;color:#4c1d95;font:700 clamp(28px,5vh,56px) Fredoka;padding:.4em .9em;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.2);z-index:60';
  document.body.appendChild(d);d.animate([{transform:'translateX(-50%) scale(.3)'},{transform:'translateX(-50%) scale(1.1)'},{transform:'translateX(-50%) scale(1)'}],{duration:300});setTimeout(()=>d.remove(),ms)}
addEventListener('pointermove',e=>{if(Math.random()>.35)return;const s=document.createElement('div');s.textContent=['✨','⭐','💫'][Math.random()*3|0];
  s.style.cssText=`position:absolute;left:${e.clientX}px;top:${e.clientY}px;font-size:28px`;fx.appendChild(s);
  s.animate([{transform:'scale(1)',opacity:1},{transform:'translateY(40px) scale(.2)',opacity:0}],{duration:700}).onfinish=()=>s.remove()});
addEventListener('click',e=>{if(e.target.closest('.btn')){beep(500+Math.random()*500,100);confetti(e.clientX,e.clientY,18)}});
floaty();
/* ===== YOUR CODE BELOW ===== */
const cv=document.getElementById('g'),c=cv.getContext('2d'),W=1000,H=560;
const T=(f)=>{try{f()}catch(e){}};
let S,ship,ast,rocks,mets,keys={},wt=0,msgT=0,metT=0,thrust=0,say1='Bring me moon rocks, tiny humans!';
const stars=[...Array(80)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.5}));
const jokes=['Wiggle wiggle!','Space is my noodle bowl!','Hee hee, meteors!','Float faster!','Moon rocks taste great!','I am the worm boss!'];
function talk(s){say1=s;msgT=3}
function spawn(){rocks=[];const n=S.goal+Math.max(1,4-S.round);
 while(rocks.length<n){const x=60+Math.random()*(W-120),y=150+Math.random()*(H-220);if(x>780&&y>270)continue;rocks.push({x,y,p:Math.random()*6})}}
function init(){S={rocks:0,coins:0,round:1,goal:6,turns:3,o2:100,out:false,lvl:1,over:false,dance:0,quiz:0,qn:0};
 ship={x:500,y:400,vx:0,vy:0,ang:0};ast={x:500,y:400,vx:0,vy:0};mets=[];spawn();
 ['msg','quiz'].forEach(i=>document.getElementById(i).style.display='none');talk('Bring me moon rocks, tiny humans!')}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function toggle(){if(S.dance||S.over||S.quiz)return;
 if(!S.out){S.out=true;ship.vx=ship.vy=0;ast.x=ship.x;ast.y=ship.y-50;ast.vx=ast.vy=0;T(()=>beep(600));talk('Float out and grab rocks!')}
 else if(D(ast,ship)<80){S.out=false;S.o2=100;T(()=>beep(900));talk('Safe! Oxygen refilled!')}
 else talk('Too far from the ship!')}
document.getElementById('enter').onclick=toggle;
document.getElementById('upg').onclick=()=>{const cost=5*S.lvl;if(S.coins>=cost){S.coins-=cost;S.lvl++;T(()=>confetti());talk('Rocket level '+S.lvl+'! Zoom!')}else talk('Need '+cost+' coins!')};
document.getElementById('again').onclick=init;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==' '){e.preventDefault();toggle()}if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function lose(){S.turns--;S.out=false;S.o2=100;T(()=>beep(150));
 if(S.turns<=0){S.over=true;document.getElementById('mt').innerHTML='😵 Out of turns!<br>You got to round '+S.round;document.getElementById('msg').style.display='flex'}
 else talk('Oxygen ran out! Lost a turn!')}
// multiplication quiz
function newQ(){const mx=Math.min(9,5+Math.floor(S.round/2)),a=2+Math.random()*(mx-1)|0,b=2+Math.random()*4|0,ans=a*b;
 const o=new Set([ans]);while(o.size<4){const d=[a,b,1,2,3,10][Math.random()*6|0]*(Math.random()<.5?1:-1);const v=ans+d;if(v>0)o.add(v)}
 const opts=[...o].sort(()=>Math.random()-.5);
 document.getElementById('qh').textContent='🧮 Multiplication Round! '+(S.qn+1)+'/3';
 document.getElementById('qq').textContent=a+' × '+b+' = ?';
 const qa=document.getElementById('qa');qa.innerHTML='';
 opts.forEach(v=>{const bt=document.createElement('button');bt.className='qb';bt.textContent=v;bt.onclick=()=>{
  if(v===ans){S.qn++;T(()=>beep(900));if(S.qn>=3)endQuiz();else{document.getElementById('qf').textContent='✅ Correct!';newQ()}}
  else{T(()=>beep(150));document.getElementById('qf').textContent='🤔 Not quite, try again!'}};qa.appendChild(bt)})}
function startQuiz(){S.quiz=1;S.qn=0;document.getElementById('qf').textContent='Solve 3 to unlock the dance!';document.getElementById('quiz').style.display='flex';newQ()}
function endQuiz(){S.quiz=0;document.getElementById('quiz').style.display='none';S.dance=4;T(()=>confetti());T(()=>tune());talk('NOOO! You did it! Dance!')}
function step(dt){wt+=dt;if(msgT>0)msgT-=dt;thrust=0;
 if(S.quiz)return;
 if(S.dance>0){S.dance-=dt;if(S.dance<=0){S.round++;S.goal+=2;S.rocks=0;S.o2=100;S.out=false;mets=[];spawn();talk('Round '+S.round+'! Bring MORE!')}return}
 if(S.over)return;
 const L=keys.arrowleft||keys.a,R=keys.arrowright||keys.d,U=keys.arrowup||keys.w,Dn=keys.arrowdown||keys.s;
 const m=S.out?ast:ship,k=dt*60*.6;
 if(S.out){const sp=.22;m.vx=(m.vx+((R?1:0)-(L?1:0))*sp)*.95;m.vy=(m.vy+((Dn?1:0)-(U?1:0))*sp)*.95}
 else{ship.ang+=((R?1:0)-(L?1:0))*3.2*dt;if(U){const a=.22+S.lvl*.05;ship.vx+=Math.sin(ship.ang)*a;ship.vy-=Math.cos(ship.ang)*a;thrust=1}
  const f=Dn?.88:.975;ship.vx*=f;ship.vy*=f}
 m.x+=m.vx*k;m.y+=m.vy*k;
 if(m.x<30||m.x>W-30){m.vx*=-.5}if(m.y<130||m.y>H-30){m.vy*=-.5}
 m.x=Math.max(30,Math.min(W-30,m.x));m.y=Math.max(130,Math.min(H-30,m.y));
 const rad=S.out?30:45+S.lvl*14;
 rocks=rocks.filter(r=>{if(D(r,m)<rad){S.rocks++;S.coins+=S.out?1:2;T(()=>beep(800+S.rocks*30));return false}return true});
 if(S.rocks>=S.goal){startQuiz();return}
 if(S.out){S.o2-=dt*(4.5+S.round*.7);if(S.o2<=0)lose()}
 metT-=dt;if(metT<=0){metT=Math.max(.4,1.3-S.round*.14);const x=40+Math.random()*680;mets.push({x,y:100,vx:(Math.random()-.5)*(2+S.round*.3),vy:1.5+Math.random()*2+S.round*.35});if(Math.random()<.2)talk(jokes[Math.random()*jokes.length|0])}
 mets=mets.filter(e=>{e.x+=e.vx*k*1.1;e.y+=e.vy*k*1.1;
  if(S.out&&D(e,ast)<34){S.o2-=15;T(()=>beep(200));talk('OUCH! Meteor!');if(S.o2<=0)lose();return false}
  return e.y<H+30&&e.x>-30&&e.x<W+30})}
function txt(s,x,y,z){c.font=z+'px serif';c.fillText(s,x,y)}
function rr(x,y,w,h,r,f){c.fillStyle=f;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function drawShip(){c.save();c.translate(ship.x,ship.y);c.rotate(ship.ang);const k=.85+S.lvl*.08;c.scale(k,k);
 if(thrust){c.fillStyle='#fa0';c.beginPath();c.moveTo(-9,22);c.lineTo(0,50+Math.random()*20);c.lineTo(9,22);c.fill();c.fillStyle='#ff6';c.beginPath();c.moveTo(-4,22);c.lineTo(0,38+Math.random()*10);c.lineTo(4,22);c.fill()}
 c.fillStyle='#e33';c.beginPath();c.moveTo(-14,5);c.lineTo(-30,32);c.lineTo(-14,25);c.fill();c.beginPath();c.moveTo(14,5);c.lineTo(30,32);c.lineTo(14,25);c.fill();
 c.fillStyle='#eee';c.beginPath();c.moveTo(0,-48);c.quadraticCurveTo(22,-20,16,24);c.lineTo(-16,24);c.quadraticCurveTo(-22,-20,0,-48);c.fill();
 c.fillStyle='#e33';c.beginPath();c.moveTo(0,-48);c.quadraticCurveTo(10,-40,13,-28);c.lineTo(-13,-28);c.quadraticCurveTo(-10,-40,0,-48);c.fill();
 c.fillStyle='#4af';c.beginPath();c.arc(0,-8,9,0,7);c.fill();c.strokeStyle='#789';c.lineWidth=3;c.stroke();c.fillStyle='#fff8';c.beginPath();c.arc(-3,-11,3,0,7);c.fill();
 rr(-10,24,20,6,3,'#777');c.restore()}
function drawAstro(x,y,s,rot,wave){c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);
 rr(-20,-16,40,44,8,'#9aa');
 const a=Math.sin(wave)*.5;
 c.strokeStyle='#fff';c.lineCap='round';c.lineWidth=11;
 c.beginPath();c.moveTo(-14,-4);c.lineTo(-27,10+a*12);c.moveTo(14,-4);c.lineTo(27,10-a*12);c.stroke();
 c.beginPath();c.moveTo(-6,22);c.lineTo(-9,40-a*5);c.moveTo(6,22);c.lineTo(9,40+a*5);c.stroke();
 c.fillStyle='#fa3';c.beginPath();c.arc(-27,10+a*12,6,0,7);c.arc(27,10-a*12,6,0,7);c.fill();
 rr(-16,34-a*5,14,9,4,'#f84');rr(2,34+a*5,14,9,4,'#f84');
 rr(-15,-12,30,38,10,'#fff');rr(-9,-4,18,12,3,'#f84');c.fillStyle='#3d6';c.beginPath();c.arc(-4,2,2.5,0,7);c.fill();c.fillStyle='#46f';c.beginPath();c.arc(4,2,2.5,0,7);c.fill();
 c.fillStyle='#f44';c.fillRect(-15,16,30,4);
 c.fillStyle='#f4f4f4';c.strokeStyle='#bbb';c.lineWidth=2;c.beginPath();c.arc(0,-26,19,0,7);c.fill();c.stroke();
 const g=c.createLinearGradient(-12,-36,12,-16);g.addColorStop(0,'#fd6');g.addColorStop(.5,'#35a');g.addColorStop(1,'#123');
 c.fillStyle=g;c.beginPath();c.ellipse(0,-26,13,11,0,0,7);c.fill();c.fillStyle='#fff9';c.beginPath();c.ellipse(-5,-30,4,2.5,-.5,0,7);c.fill();
 c.restore()}
function draw(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0030');g.addColorStop(1,'#31107a');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#fff';stars.forEach(s=>{c.globalAlpha=.5+.5*Math.sin(wt*2+s.x);c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});c.globalAlpha=1;
 c.textAlign='center';c.textBaseline='middle';
 const hx=40+14*48,hy=70+Math.sin(wt*2+8)*26;
 for(let i=0;i<14;i++){const x=40+i*48,y=70+Math.sin(wt*2+i*.6)*26;c.fillStyle=i%2?'#7f4':'#4d3';c.beginPath();c.arc(x,y,34,0,7);c.fill()}
 txt('🪱',hx+10,hy,100);
 const tgt=S.out?ast:ship;c.strokeStyle='#fff8';c.setLineDash([6,8]);c.lineWidth=2;c.beginPath();c.moveTo(hx,hy+40);c.lineTo(tgt.x,tgt.y-20);c.stroke();c.setLineDash([]);
 if(msgT>0){c.font='bold 26px sans-serif';const w=c.measureText(say1).width+30;c.fillStyle='#fff';c.fillRect(hx-w-60,hy+50,w,40);c.fillStyle='#222';c.fillText(say1,hx-w/2-60,hy+71)}
 const m=S.out?ast:ship,R0=Math.max(90,400-S.round*70),z=Math.max(22,40-S.round*3);
 rocks.forEach(r=>{let a=1;if(S.round>1)a=Math.max(.1,Math.min(1,1-(D(r,m)-R0)/140));c.globalAlpha=a;txt('🌕',r.x,r.y+Math.sin(wt*2+r.p)*5,z)});c.globalAlpha=1;
 mets.forEach(e=>txt('☄️',e.x,e.y,40));
 if(!S.out){c.strokeStyle='#0f84';c.lineWidth=2;c.beginPath();c.arc(ship.x,ship.y,45+S.lvl*14,0,7);c.stroke()}
 drawShip();
 if(S.out)drawAstro(ast.x,ast.y,.85,Math.sin(wt*2)*.15,wt*3);
 if(S.dance>0){c.fillStyle='#fff';c.font='bold 80px sans-serif';c.fillText('🎉 SPACE DANCE! 🎉',W/2,H/2-80);for(let i=0;i<6;i++)drawAstro(120+i*150,380+Math.sin(wt*8+i)*40,1.3,Math.sin(wt*6+i)*.6,wt*10+i)}
 if(S.out&&S.o2<25&&!S.quiz){const p=Math.abs(Math.sin(wt*7));c.fillStyle='rgba(255,0,0,'+(.15+.3*p)+')';c.fillRect(0,0,W,H);c.fillStyle='#fff';c.font='bold 54px sans-serif';c.fillText('⚠️ LOW OXYGEN! GET TO THE SHIP! ⚠️',W/2,H/2)}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();
 document.getElementById('board').innerHTML='🌕 '+S.rocks+'/'+S.goal+' &nbsp;🪙 '+S.coins+'<br>Round '+S.round+' &nbsp;'+'🚀'.repeat(Math.max(0,S.turns));
 const b=document.getElementById('o2b');b.style.width=Math.max(0,S.o2)+'%';b.style.background=S.o2<30?'#f33':S.o2<60?'#fc3':'#3f6';
 document.getElementById('o2t').textContent=S.out?'💨 Oxygen '+Math.ceil(S.o2)+'%':'✅ Safe in ship';
 document.getElementById('upg').textContent='⬆️ Upgrade Rocket ('+5*S.lvl+' 🪙)';
 document.getElementById('hint').textContent=S.out?'Arrows: float around':'◀ ▶ turn · ▲ go forward · ▼ brake';
 requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);

</script>
