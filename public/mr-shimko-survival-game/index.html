<style>
:root{--a:#7c3aed;--b:#ec4899;--c:#f59e0b;--ink:#2e1065}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(135deg,#fde68a,#fbcfe8,#c4b5fd,#a5f3fc);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
header{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;text-align:center;padding:1.2vh 2vw;font-size:clamp(32px,5.5vh,64px);font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.25);text-transform:capitalize;z-index:2}
header span{display:inline-block;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(12deg) scale(1.2)}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:2vh 3vw;position:relative;z-index:1;text-align:center}
/* ---- BIG BUTTONS: use class="btn" ---- */
.btn{font:700 clamp(28px,5vh,56px) Fredoka,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,var(--b),var(--a));border:0;border-radius:999px;padding:.4em 1.1em;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .1s;animation:pop 2.4s ease-in-out infinite}
.btn:hover{transform:scale(1.08) rotate(-2deg)}.btn:active{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes pop{50%{transform:scale(1.04)}}
.shake{animation:shk .5s}@keyframes shk{25%{transform:translateX(-14px) rotate(-3deg)}75%{transform:translateX(14px) rotate(3deg)}}
.bounce{animation:bnc .6s}@keyframes bnc{40%{transform:translateY(-40px) scale(1.2)}}
.spin{animation:spn .8s}@keyframes spn{to{transform:rotate(360deg)}}
footer{background:rgba(46,16,101,.9);color:#fff;text-align:center;padding:1vh 2vw;font-size:clamp(16px,2.4vh,28px);z-index:2}
/* ---- BLING layer ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:fixed;bottom:-80px;font-size:48px;opacity:.55;animation:fl linear forwards;pointer-events:none;z-index:0}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
#gc{border-radius:20px;border:6px solid #fff;max-width:98vw;background:#2e7d32;box-shadow:0 10px 40px #0008;cursor:pointer}

</style>

<body>
<header><span>🌟</span> mr shimko 2 <span>🌟</span></header>
<main id="stage">
  <!-- BUILD THE SITE HERE: big canvas area -->
  <div id="canvas" style="flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh"><canvas id="gc"></canvas>
</div>
</main>

<div id="fx"></div>

<script>
/* ===== BLING KIT (keep! call these from your code) =====
 confetti(x?,y?)  burst of confetti      beep(freq?,ms?)   happy sound
 tune([notes])    play note list         floaty(['🦖','🎈']) emoji rise in background
 wiggle(el,'shake'|'bounce'|'spin')       say('text')       speech bubble toast
 Sparkle cursor trail is automatic; every .btn click auto-plays pop + confetti. */
const $=s=>document.querySelector(s), fx=$('#fx');
let _ac; function beep(f=660,ms=120,type='sine'){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=_ac.createOscillator(),g=_ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(_ac.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+ms/1000);o.stop(_ac.currentTime+ms/1000)}catch(e){}}
function tune(n=[523,659,784,1047]){n.forEach((f,i)=>setTimeout(()=>beep(f,180,'triangle'),i*130))}
function confetti(x=innerWidth/2,y=innerHeight/2,n=40){const C=['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899'];
  for(let i=0;i<n;i++){const d=document.createElement('div'),a=Math.random()*6.28,v=150+Math.random()*350;
    d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:12px;height:18px;background:${C[i%6]};border-radius:3px`;fx.appendChild(d);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+300}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1200+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove()}}
function floaty(list=['⭐','🎈','🌈','🦋']){setInterval(()=>{const e=document.createElement('div');e.className='float';e.textContent=list[Math.random()*list.length|0];
  e.style.left=Math.random()*95+'vw';e.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),14000)},900)}
function wiggle(el,c='shake'){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),900)}
function say(t,ms=2500){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14vh;left:50%;transform:translateX(-50%);background:#fff;color:#4c1d95;font:700 clamp(28px,5vh,56px) Fredoka;padding:.4em .9em;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.2);z-index:60';
  document.body.appendChild(d);d.animate([{transform:'translateX(-50%) scale(.3)'},{transform:'translateX(-50%) scale(1.1)'},{transform:'translateX(-50%) scale(1)'}],{duration:300});setTimeout(()=>d.remove(),ms)}
addEventListener('pointermove',e=>{if(Math.random()>.35)return;const s=document.createElement('div');s.textContent=['✨','⭐','💫'][Math.random()*3|0];
  s.style.cssText=`position:absolute;left:${e.clientX}px;top:${e.clientY}px;font-size:28px`;fx.appendChild(s);
  s.animate([{transform:'scale(1)',opacity:1},{transform:'translateY(40px) scale(.2)',opacity:0}],{duration:700}).onfinish=()=>s.remove()});
addEventListener('click',e=>{if(e.target.closest('.btn')){beep(500+Math.random()*500,100);confetti(e.clientX,e.clientY,18)}});
floaty();
/* ===== YOUR CODE BELOW ===== */
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
function rs(){cv.width=Math.min(innerWidth-30,1600);cv.height=Math.floor(innerHeight*0.66);}
rs();addEventListener('resize',rs);
const S=(f,ms,t)=>{try{beep(f,ms,t)}catch(e){}};
const H=(x,y,s)=>{let n=(x*374761393+y*668265263+s*1274126177)|0;n=(n^(n>>>13))*1274126177|0;return((n^(n>>>16))>>>0)/4294967296};
const W=[
 {e:'🐾',n:'Bare Paws',d:1},{e:'🥄',n:'Wooden Spoon',d:2},{e:'🥖',n:'Baguette',d:3},
 {e:'🍳',n:'Frying Pan',d:5},{e:'🧹',n:'Super Broom',d:8},{e:'🪄',n:'Sparkle Wand',d:12},{e:'🍭',n:'Mega Lollipop',d:18}];
const F=[{e:'🍓',v:12},{e:'🍎',v:18},{e:'🍄',v:26},{e:'🍗',v:36},{e:'🧁',v:50},{e:'🍰',v:70}];
const DM=['🐛','🐌','🦔','🐗','🦖','🐲'],DN=['Gloop Bug','Sleepy Snail','Grumpy Hedgehog','Boar Buddy','Silly Dino','Dragon Pup'];
const NM=['👻','🦇','🦉','👾','🤖','🐙'],NN=['Boo Ghost','Bat Buddy','Owl Grump','Space Blob','Robo Grump','Octo Boo'];
const DAY=70;
let st='menu',P,mons,fl,eaten,t,kills,best=0,spT,lastN,nights,keys={},overT=0,maxD,flash=0;
function start(){P={x:0,y:60,hp:100,food:100,w:0,cd:0,sw:0,fx:0,fy:1,hit:0,regen:0};mons=[];fl=[];eaten=new Set();t=0;kills=0;spT=2;lastN=false;nights=0;maxD=0;st='play';
 mons.push(mk(-110,-70,0,false));}
function tier(x,y){return Math.min(5,Math.floor(Math.hypot(x,y)/700))}
function mk(x,y,T,g){const hp=(g?3:2)+T*3;return{x,y,T,g,hp,mhp:hp,cd:0,wa:Math.random()*6.28,fl:0,life:g?0:99,bob:Math.random()*6}}
function night(){const p=(t%DAY)/DAY;if(p<.55)return 0;if(p<.62)return(p-.55)/.07;if(p<.92)return 1;return 1-(p-.92)/.08}
function ft(x,y,txt,c){fl.push({x,y,txt,c:c||'#fff',a:1.4})}
function bld(gx,gy){if(H(gx,gy,11)<.6){const x=gx*800+H(gx,gy,12)*600,y=gy*800+H(gx,gy,13)*600;if(Math.hypot(x,y)>550)return{x,y,e:H(gx,gy,14)>.5?'🏚️':'🛖'}}return null}
function fogAt(){let f=0;const cx=Math.floor(P.x/800),cy=Math.floor(P.y/800);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const q=bld(cx+a,cy+b);if(q){const d=Math.hypot(q.x-P.x,q.y-P.y);f=Math.max(f,Math.min(1,1-d/380))}}return f}
function bonk(){if(st!=='play'||P.cd>0)return;P.cd=.35;P.sw=.22;S(300,60,'square');
 const r=52+P.w*8+20,dmg=W[P.w].d;let hitAny=false;
 for(const m of mons){const dx=m.x-P.x,dy=m.y-P.y,d=Math.hypot(dx,dy);
  if(d<r+20){hitAny=true;m.hp-=dmg;m.fl=.2;m.x+=dx/d*35;m.y+=dy/d*35;ft(m.x,m.y-30,'BONK!','#ffeb3b');S(500+Math.random()*200,80);
   if(m.hp<=0){m.dead=true;kills++;ft(m.x,m.y,'💨 POOF!','#fff');S(880,150,'triangle');
    const wi=Math.min(6,m.T+1);
    if(wi>P.w){P.w=wi;ft(P.x,P.y-70,'Got '+W[wi].e+' '+W[wi].n+'!','#ffd54f');try{tune()}catch(e){}try{confetti(cv.getBoundingClientRect().left+cv.width/2,cv.getBoundingClientRect().top+cv.height/2,30)}catch(e){}}
    else{P.food=Math.min(100,P.food+8);ft(P.x,P.y-70,'Spare '+W[wi].e+'! +8 snack','#a5d6a7')}}}}
 mons=mons.filter(m=>!m.dead)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 keys[k]=true;
 if(st==='menu')start();else if(st==='over'&&overT>.8)start();else if(k===' ')bonk()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener('click',()=>{if(st==='menu')start();else if(st==='over'&&overT>.8)start();else bonk()});
function T_(txt,x,y,sz,col,al){ctx.font='bold '+sz+'px "Fredoka","Comic Sans MS",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.lineWidth=sz/6;ctx.strokeStyle='#000b';ctx.strokeText(txt,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(txt,x,y)}
function E(e,x,y,sz){ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y)}
function bar(x,y,w,h,v,col,lab){ctx.fillStyle='#000a';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#444';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,w*Math.max(0,v)/100,h);T_(lab,x+8,y+h/2+1,h*.8,'#fff','left')}
function update(dt){
 t+=dt;P.cd-=dt;P.sw-=dt;P.hit-=dt;P.regen-=dt;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;P.fx=dx;P.fy=dy;P.x+=dx*200*dt;P.y+=dy*200*dt}
 maxD=Math.max(maxD,Math.hypot(P.x,P.y));
 const n=night(),isN=n>.5;
 if(isN&&!lastN){say('🌙 NIGHT! Spooky creatures are hunting - run!');S(150,400,'sawtooth')}
 if(!isN&&lastN){nights++;say('☀️ You survived the night! +200 bonus');try{confetti()}catch(e){}try{tune()}catch(e){}}
 lastN=isN;
 P.food-=1.4*dt;if(P.food<=0){P.food=0;P.hp-=4*dt;if(Math.random()<.02)ft(P.x,P.y-50,'Tummy rumbles! Find food 🍎','#ffab91')}
 else if(P.food>40&&P.regen<=0&&P.hp<100)P.hp=Math.min(100,P.hp+1.5*dt);
 // food pickups
 const gx0=Math.floor(P.x/150),gy0=Math.floor(P.y/150);
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const gx=gx0+a,gy=gy0+b,k=gx+','+gy;
  if(H(gx,gy,7)<.15&&!eaten.has(k)){const x=gx*150+H(gx,gy,8)*120,y=gy*150+H(gx,gy,9)*120;
   if(Math.hypot(x-P.x,y-P.y)<42){eaten.add(k);const f=F[tier(x,y)];P.food=Math.min(100,P.food+f.v);ft(x,y-20,f.e+' +'+f.v+' food','#c5e1a5');S(700,100,'triangle');S(900,100,'triangle')}}}
 // spawn
 spT-=dt;const T=tier(P.x,P.y),cap=(isN?12:6)+T;
 if(spT<=0&&mons.length<cap){spT=(isN?1.3:3.5)*Math.max(.5,1-t/400);
  if(isN&&Math.random()<.3&&Math.hypot(P.x,P.y)<900){mons.push(mk((Math.random()-.5)*280,(Math.random()-.5)*200,0,true));ft(0,-20,'👻 Boo! In the cabin!','#b39ddb')}
  else{const a=Math.random()*6.28,r=800+Math.random()*200,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;mons.push(mk(x,y,tier(x,y),isN))}}
 for(const m of mons){m.cd-=dt;m.fl-=dt;m.bob+=dt*5;
  const ex=P.x-m.x,ey=P.y-m.y,d=Math.hypot(ex,ey)||1,sp=m.g?110+m.T*12:40+m.T*8,rng=m.g?1100:220;
  if(!isN&&m.g){m.life-=dt;if(m.life<=-3&&!m.dead){m.dead=true;ft(m.x,m.y,'💨 faded','#ddd')}}
  if(d<rng){m.x+=ex/d*sp*dt;m.y+=ey/d*sp*dt}
  else{if(Math.random()<.02)m.wa+=(Math.random()-.5)*2;m.x+=Math.cos(m.wa)*sp*.4*dt;m.y+=Math.sin(m.wa)*sp*.4*dt}
  if(d<36&&m.cd<=0){const dm=Math.round((5+m.T*3)*(m.g?1.3:1));P.hp-=dm;P.hit=.3;P.regen=3;m.cd=.9;ft(P.x,P.y-40,'-'+dm+' ⚡','#ff8a80');S(120,150,'sawtooth')}
  if(d>1500)m.dead=true}
 mons=mons.filter(m=>!m.dead);
 for(const f of fl){f.a-=dt;f.y-=30*dt}fl=fl.filter(f=>f.a>0);
 if(P.hp<=0){st='over';overT=0;best=Math.max(best,score());S(200,500,'sawtooth')}}
function score(){return Math.floor(t*10)+kills*50+nights*200+Math.floor(maxD/5)}
function draw(){
 const w=cv.width,h=cv.height,cx=w/2-P.x,cy=h/2-P.y,T=tier(P.x,P.y);
 ctx.fillStyle='hsl('+(125-T*9)+',42%,'+(33-T*2)+'%)';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='rgba(0,60,0,.35)';
 for(let gx=Math.floor((P.x-w/2)/70);gx<=Math.floor((P.x+w/2)/70);gx++)for(let gy=Math.floor((P.y-h/2)/70);gy<=Math.floor((P.y+h/2)/70);gy++)
  if(H(gx,gy,3)<.4)ctx.fillRect(gx*70+H(gx,gy,4)*60+cx,gy*70+H(gx,gy,5)*60+cy,6,12);
 // cabin
 const cb=(x,y,ww,hh)=>[x+cx,y+cy,ww,hh];
 ctx.fillStyle='#a1783f';ctx.fillRect(...cb(-190,-140,380,280));
 ctx.fillStyle='#8d6330';for(let i=-140;i<140;i+=28)ctx.fillRect(...cb(-190,i,380,3));
 ctx.fillStyle='#5d3a1a';ctx.fillRect(...cb(-200,-150,400,14));ctx.fillRect(...cb(-200,-150,14,300));ctx.fillRect(...cb(186,-150,14,300));
 ctx.fillRect(...cb(-200,136,150,14));ctx.fillRect(...cb(50,136,150,14));
 ctx.fillStyle='#ffe082';ctx.fillRect(...cb(-50,142,100,4));
 E('🛏️',-120+cx,-90+cy,56);E('🔥',130+cx,-90+cy,50);E('🪑',120+cx,70+cy,44);E('🧸',-130+cx,70+cy,40);
 T_('🏠 CABIN',cx,-185+cy,30,'#ffe082');
 // trees
 for(let gy=Math.floor((P.y-h/2)/110)-1;gy<=Math.floor((P.y+h/2)/110)+1;gy++)for(let gx=Math.floor((P.x-w/2)/110)-1;gx<=Math.floor((P.x+w/2)/110)+1;gx++){
  if(H(gx,gy,1)<.3){const x=gx*110+H(gx,gy,2)*90,y=gy*110+H(gx,gy,6)*90;if(Math.abs(x)<270&&Math.abs(y)<230)continue;E(H(gx,gy,15)<.5?'🌲':'🌳',x+cx,y+cy,70+H(gx,gy,16)*30)}}
 // buildings
 for(let gy=Math.floor((P.y-h/2)/800)-1;gy<=Math.floor((P.y+h/2)/800)+1;gy++)for(let gx=Math.floor((P.x-w/2)/800)-1;gx<=Math.floor((P.x+w/2)/800)+1;gx++){const q=bld(gx,gy);if(q)E(q.e,q.x+cx,q.y+cy,110)}
 // food
 for(let gy=Math.floor((P.y-h/2)/150)-1;gy<=Math.floor((P.y+h/2)/150)+1;gy++)for(let gx=Math.floor((P.x-w/2)/150)-1;gx<=Math.floor((P.x+w/2)/150)+1;gx++){
  if(H(gx,gy,7)<.15&&!eaten.has(gx+','+gy)){const x=gx*150+H(gx,gy,8)*120,y=gy*150+H(gx,gy,9)*120;E(F[tier(x,y)].e,x+cx,y+cy+Math.sin(t*4+gx)*4,38)}}
 // monsters
 for(const m of mons){const sz=46+m.T*7,x=m.x+cx,y=m.y+cy+Math.sin(m.bob)*4;
  ctx.globalAlpha=m.g&&m.life<=0&&!(night()>.5)?.5:1;
  if(m.fl>0){ctx.shadowColor='#fff';ctx.shadowBlur=30}
  E(m.g?NM[m.T]:DM[m.T],x,y,sz);ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(m.hp<m.mhp){ctx.fillStyle='#000a';ctx.fillRect(x-24,y-sz/2-12,48,8);ctx.fillStyle='#4caf50';ctx.fillRect(x-24,y-sz/2-12,48*m.hp/m.mhp,8)}}
 const drawP=()=>{ctx.globalAlpha=P.hit>0&&Math.floor(t*20)%2?.4:1;E('🦊',w/2,h/2,56);ctx.globalAlpha=1;
  if(P.sw>0){const a=Math.atan2(P.fy,P.fx)+(P.sw/.22-.5)*2.2;ctx.save();ctx.translate(w/2+Math.cos(a)*48,h/2+Math.sin(a)*48);ctx.rotate(a+1.57);E(W[P.w].e,0,0,48);ctx.restore()}
  else E(W[P.w].e,w/2+(P.fx>=0?30:-30),h/2+8,32)};
 drawP();
 for(const f of fl)T_(f.txt,f.x+cx,f.y+cy,26,f.c);
 // fog
 const fg=fogAt();
 if(fg>0){ctx.fillStyle='rgba(225,235,240,'+(fg*.82)+')';ctx.fillRect(0,0,w,h);ctx.globalAlpha=fg;
  for(let i=0;i<9;i++)E('☁️',((i*263+t*25)%(w+200))-100,(i*97)%h,110+i*8);ctx.globalAlpha=1;drawP();
  if(fg>.25)T_('🌫️ Foggy near the old building...',w/2,h-30,30,'#455a64')}
 // night
 const n=night();
 if(n>0){const g=ctx.createRadialGradient(w/2,h/2,70,w/2,h/2,Math.max(w,h)*.42);g.addColorStop(0,'rgba(0,0,40,0)');g.addColorStop(1,'rgba(0,0,30,'+(.9*n)+')');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(20,0,60,'+(.18*n)+')';ctx.fillRect(0,0,w,h)}
 // HUD
 bar(14,14,260,30,P.hp,'#ff5252','⚡ Energy');
 bar(14,56,260,30,P.food,'#ff9800','🍖 Food');
 T_(W[P.w].e+' '+W[P.w].n+' (hits '+W[P.w].d+')',14,112,28,'#ffd54f','left');
 T_('Score '+score(),w-16,28,40,'#fff','right');
 const left=Math.ceil(DAY*(n>.5||t%DAY/DAY>.55?1:.55)-(t%DAY)+(t%DAY/DAY>.55?0:0));
 T_((n>.5?'🌙 NIGHT':'☀️ DAY')+'  '+Math.floor(t)+'s',w-16,70,28,n>.5?'#b39ddb':'#fff59d','right');
 T_('🌲 Level '+(T+1)+'   🏠 '+Math.round(Math.hypot(P.x,P.y)/10)+'m',w-16,102,26,'#c8e6c9','right');
