<style>
:root{--a:#7c3aed;--b:#ec4899;--c:#f59e0b;--ink:#2e1065}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(135deg,#fde68a,#fbcfe8,#c4b5fd,#a5f3fc);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
header{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;text-align:center;padding:1.2vh 2vw;font-size:clamp(32px,5.5vh,64px);font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.25);text-transform:capitalize;z-index:2}

@keyframes wob{50%{transform:rotate(12deg) scale(1.2)}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:2vh 3vw;position:relative;z-index:1;text-align:center}
/* ---- BIG BUTTONS: use class="btn" ---- */
.btn{font:700 clamp(28px,5vh,56px) Fredoka,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,var(--b),var(--a));border:0;border-radius:999px;padding:.4em 1.1em;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .1s;animation:pop 2.4s ease-in-out infinite}
.btn:hover{transform:scale(1.08) rotate(-2deg)}.btn:active{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes pop{50%{transform:scale(1.04)}}
.shake{animation:shk .5s}@keyframes shk{25%{transform:translateX(-14px) rotate(-3deg)}75%{transform:translateX(14px) rotate(3deg)}}
.bounce{animation:bnc .6s}@keyframes bnc{40%{transform:translateY(-40px) scale(1.2)}}
.spin{animation:spn .8s}@keyframes spn{to{transform:rotate(360deg)}}
footer{background:rgba(46,16,101,.9);color:#fff;text-align:center;padding:1vh 2vw;font-size:clamp(16px,2.4vh,28px);z-index:2}
/* ---- BLING layer ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:fixed;bottom:-80px;font-size:48px;opacity:.55;animation:fl linear forwards;pointer-events:none;z-index:0}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
#g{position:relative;width:100%;height:68vh;border-radius:24px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.25);background:#7dd3fc}
#g canvas{display:block}
.hud{position:absolute;color:#fff;font-weight:700;text-shadow:0 3px 0 #000a,0 0 12px #000;pointer-events:none;line-height:1.15;white-space:pre}
#hl{left:2%;top:3%;font-size:clamp(22px,4.2vh,46px);text-align:left}
#hr{right:2%;top:3%;font-size:clamp(22px,4.2vh,46px);text-align:right}
#tu{left:10%;right:10%;top:16%;text-align:center;font-size:clamp(28px,6vh,66px);color:#fde047;white-space:normal}
#bn{left:0;right:0;top:36%;text-align:center;font-size:clamp(50px,16vh,170px);color:#fde047}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 2%}
.panel{background:rgba(30,10,80,.82);border-radius:28px;padding:1.6vh 1.6vw;color:#fff;text-align:center;width:56%;max-height:96%;overflow:auto;display:flex;flex-direction:column;gap:1vh;align-items:center;box-shadow:0 8px 0 #0006}
.panel h1{font-size:clamp(28px,5.4vh,64px);margin:0;font-weight:700;line-height:1;color:#fde047}
.panel p{margin:0;font-size:clamp(16px,2.8vh,30px)}
.cars,.lvls,.row{display:flex;gap:.8vw;justify-content:center;flex-wrap:wrap;align-items:center}
.card{font:700 clamp(14px,2.3vh,26px) Fredoka,system-ui;color:#fff;background:#4c1d95;border:5px solid transparent;border-radius:20px;padding:.8vh .9vw;cursor:pointer;line-height:1.25}
.card.sel{border-color:#fde047;transform:scale(1.06);background:#6d28d9}
.chip{border-radius:999px;border-color:#fff3}
.sw{width:4vh;height:4vh;border-radius:50%;border:4px solid #fff5;cursor:pointer}.sw.sel{border-color:#fde047;transform:scale(1.3)}
.lv{font:700 clamp(18px,3.2vh,38px) Fredoka,system-ui;width:2.1em;height:2.1em;border-radius:50%;border:0;background:#10b981;color:#fff;cursor:pointer}
.lv.sel{outline:5px solid #fde047}.lv:disabled{background:#6b7280;opacity:.6;cursor:not-allowed}
.sm{font-size:clamp(22px,3.6vh,42px)!important}

<script>
/* ===== BLING KIT (keep! call these from your code) =====
 confetti(x?,y?)  burst of confetti      beep(freq?,ms?)   happy sound
 tune([notes])    play note list         floaty(['🦖','🎈']) emoji rise in background
 wiggle(el,'shake'|'bounce'|'spin')       say('text')       speech bubble toast
 Sparkle cursor trail is automatic; every .btn click auto-plays pop + confetti. */
const $=s=>document.querySelector(s), fx=$('#fx');
let _ac; function beep(f=660,ms=120,type='sine'){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=_ac.createOscillator(),g=_ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(_ac.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+ms/1000);o.stop(_ac.currentTime+ms/1000)}catch(e){}}
function tune(n=[523,659,784,1047]){n.forEach((f,i)=>setTimeout(()=>beep(f,180,'triangle'),i*130))}
function confetti(x=innerWidth/2,y=innerHeight/2,n=40){const C=['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899'];
  for(let i=0;i<n;i++){const d=document.createElement('div'),a=Math.random()*6.28,v=150+Math.random()*350;
    d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:12px;height:18px;background:${C[i%6]};border-radius:3px`;fx.appendChild(d);
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+300}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1200+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove()}}
function floaty(list=['⭐','🎈','🌈','🦋']){setInterval(()=>{const e=document.createElement('div');e.className='float';e.textContent=list[Math.random()*list.length|0];
  e.style.left=Math.random()*95+'vw';e.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),14000)},900)}
function wiggle(el,c='shake'){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),900)}
function say(t,ms=2500){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14vh;left:50%;transform:translateX(-50%);background:#fff;color:#4c1d95;font:700 clamp(28px,5vh,56px) Fredoka;padding:.4em .9em;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.2);z-index:60';
  document.body.appendChild(d);d.animate([{transform:'translateX(-50%) scale(.3)'},{transform:'translateX(-50%) scale(1.1)'},{transform:'translateX(-50%) scale(1)'}],{duration:300});setTimeout(()=>d.remove(),ms)}
addEventListener('pointermove',e=>{if(Math.random()>.35)return;const s=document.createElement('div');s.textContent=['✨','⭐','💫'][Math.random()*3|0];
  s.style.cssText=`position:absolute;left:${e.clientX}px;top:${e.clientY}px;font-size:28px`;fx.appendChild(s);
  s.animate([{transform:'scale(1)',opacity:1},{transform:'translateY(40px) scale(.2)',opacity:0}],{duration:700}).onfinish=()=>s.remove()});
addEventListener('click',e=>{if(e.target.closest('.btn')){beep(500+Math.random()*500,100);confetti(e.clientX,e.clientY,18)}});
floaty();
/* ===== YOUR CODE BELOW ===== */
const A=120,B=75,TAU=Math.PI*2;
const CARS=[{n:'Drift3000',c:0xef4444,max:44,acc:24,grip:3.4,s:4,g:3,e:'🏎️'},
{n:'Bubble Bug',c:0xfacc15,max:38,acc:26,grip:4.6,s:3,g:5,e:'🚕'},
{n:'Rocket Rhino',c:0x3b82f6,max:50,acc:20,grip:2.6,s:5,g:2,e:'🚙'}];
const LV=[{n:'Sunny Speedway',laps:2,ai:2,sp:27,cones:6,oil:1,boost:2,hay:0,mov:0,sky:0x7dd3fc,grass:0x4ade80},
{n:'Triangle Twist',laps:2,ai:3,sp:30,cones:10,oil:2,boost:2,hay:2,mov:0,sky:0xfdba74,grass:0xa3e635},
{n:'Neon Peanut',laps:3,ai:3,sp:33,cones:12,oil:2,boost:2,hay:2,mov:1,sky:0x312e81,grass:0x166534},
{n:'Candy Curves',laps:3,ai:4,sp:36,cones:14,oil:2,boost:3,hay:3,mov:2,sky:0xf9a8d4,grass:0x86efac},
{n:'Wiggle Grand Prix',laps:3,ai:5,sp:39,cones:16,oil:3,boost:3,hay:3,mov:3,sky:0x67e8f9,grass:0xfde047}];
// track shapes: radius wobble around the center, so every level has a different layout
const SH=[t=>1,t=>1+.14*Math.cos(3*t),t=>1+.2*Math.cos(2*t),t=>1+.12*Math.cos(4*t)+.08*Math.cos(t),t=>1+.04*Math.cos(5*t)+.1*Math.cos(2*t)];
let shape=0;const rho=t=>SH[shape](t);
const pt=(t,k)=>{const r=rho(t)*k;return[A*r*Math.cos(t),B*r*Math.sin(t)]};
const el=id=>document.getElementById(id);
const G=el('g'),ov=el('ov'),hl=el('hl'),hr=el('hr'),tu=el('tu'),bn=el('bn');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);G.insertBefore(renderer.domElement,G.firstChild);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(65,1.6,0.5,900);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(50,100,30);scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const grass=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),M(0x4ade80));grass.rotation.x=-Math.PI/2;scene.add(grass);
let TG=null,crowd=[],ref=null,flagKey='';
function strip(k0,k1,y,col){const n=200,pos=[],idx=[];
 for(let i=0;i<=n;i++){const t=i/n*TAU,a=pt(t,k0),b=pt(t,k1);pos.push(a[0],y,a[1],b[0],y,b[1]);if(i<n){const j=i*2;idx.push(j,j+1,j+2,j+1,j+3,j+2)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 TG.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide})))}
function slab(k0,k1,h,col){const s=new THREE.Shape(),ho=new THREE.Path();
 for(let i=0;i<=120;i++){const t=i/120*TAU,a=pt(t,k1),b=pt(t,k0);if(i){s.lineTo(a[0],-a[1]);ho.lineTo(b[0],-b[1])}else{s.moveTo(a[0],-a[1]);ho.moveTo(b[0],-b[1])}}
 s.holes.push(ho);const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false}),M(col));m.rotation.x=-Math.PI/2;TG.add(m)}
const COL=[0xef4444,0xf59e0b,0x10b981,0x3b82f6,0xa855f7,0xec4899,0xfacc15,0x22d3ee].map(M);
const SK=[0xfcd9b6,0xe0ac69,0x8d5524,0xc68642].map(M);
const bG=new THREE.BoxGeometry(1.3,1.6,.9),hG=new THREE.SphereGeometry(.6,8,8),aG=new THREE.BoxGeometry(.35,1.3,.35);
function addRow(k,y,n){for(let i=0;i<n;i++){const t=i/n*TAU,p=pt(t,k),g=new THREE.Group();
 const b=new THREE.Mesh(bG,COL[Math.floor(Math.random()*8)]);b.position.y=.8;g.add(b);
 const h=new THREE.Mesh(hG,SK[Math.floor(Math.random()*4)]);h.position.y=2.1;g.add(h);
 const ar=new THREE.Mesh(aG,h.material);ar.position.set(.95,1.7,0);g.add(ar);
 g.position.set(p[0],y,p[1]);g.scale.setScalar(1.5);g.lookAt(0,y,0);TG.add(g);crowd.push({g,y,ph:Math.random()*6,ar})}}
// referee with flags
const cv=document.createElement('canvas');cv.width=64;cv.height=32;{const c=cv.getContext('2d');for(let i=0;i<8;i++)for(let j=0;j<4;j++){c.fillStyle=(i+j)%2?'#111':'#fff';c.fillRect(i*8,j*8,8,8)}}
const checkTex=new THREE.CanvasTexture(cv);
function mkRef(){const g=new THREE.Group();
 const legs=new THREE.Mesh(new THREE.BoxGeometry(.9,1.3,.6),M(0x111111));legs.position.y=.65;g.add(legs);
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.5,.8),M(0xffffff));body.position.y=2;g.add(body);
 const st=new THREE.Mesh(new THREE.BoxGeometry(1.32,.3,.82),M(0x111111));st.position.y=2.1;g.add(st);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.55,10,10),M(0xe0ac69));hd.position.y=3.3;g.add(hd);
 const cap=new THREE.Mesh(new THREE.BoxGeometry(1.1,.35,1.1),M(0xef4444));cap.position.y=3.8;g.add(cap);
 const arm=new THREE.Group();arm.position.set(.8,2.6,0);
 const am=new THREE.Mesh(new THREE.BoxGeometry(.3,1.5,.3),M(0xffffff));am.position.y=.75;arm.add(am);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,3.4,6),M(0x6b7280));pole.position.y=2;arm.add(pole);
 const mat=new THREE.MeshBasicMaterial({color:0x22c55e,side:THREE.DoubleSide});
 const flag=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.7),mat);flag.position.set(1.3,3.2,0);arm.add(flag);
 g.add(arm);g.scale.setScalar(1.7);return {g,arm,flag,mat}}
function setFlag(k){if(k===flagKey||!ref)return;flagKey=k;ref.mat.map=k==='check'?checkTex:null;ref.mat.color.set({red:0xef4444,green:0x22c55e,yellow:0xfacc15,check:0xffffff}[k]);ref.mat.needsUpdate=true}
function buildTrack(li){shape=li;if(TG)scene.remove(TG);TG=new THREE.Group();scene.add(TG);crowd=[];flagKey='';
 strip(.8,1.2,.05,0x374151);strip(.78,.8,.07,0xef4444);strip(1.2,1.22,.07,0xef4444);strip(.8,.81,.08,0xffffff);strip(1.19,1.2,.08,0xffffff);
 slab(1.25,1.37,1.2,0x9ca3af);slab(1.37,1.55,2.4,0x6b7280);
 const x0=pt(0,.8)[0],x1=pt(0,1.2)[0],w=(x1-x0)/16;
 for(let r=0;r<2;r++)for(let i=0;i<16;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(w,.1,1.5),M((i+r)%2?0x111111:0xffffff));b.position.set(x0+w*(i+.5),.12,r*1.5-.75);TG.add(b)}
 addRow(1.31,1.2,130);addRow(1.46,2.4,160);
 ref=mkRef();ref.g.position.set(pt(0,.7)[0],0,0);ref.g.rotation.y=Math.PI/2;TG.add(ref.g)}
// cars (customizable)
const wG=new THREE.CylinderGeometry(.75,.75,.6,12);
const PAL=[0xef4444,0xf97316,0xfacc15,0x22c55e,0x06b6d4,0x3b82f6,0xa855f7,0xec4899,0xffffff,0x111827];
const STR=[null,0xffffff,0x111827,0xfacc15],STN=['None','White','Black','Gold'];
const CUST={col:null,stripe:1,spo:1,glow:0};
function mkCar(col,skin,o){const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(3,1,6),M(col));b.position.y=1.1;g.add(b);
 const nose=new THREE.Mesh(new THREE.BoxGeometry(2.6,.7,1.6),M(col));nose.position.set(0,1.8,1.9);g.add(nose);
 if(STR[o.stripe]!==null){const sc=M(STR[o.stripe]);const s1=new THREE.Mesh(new THREE.BoxGeometry(.7,.06,6.05),sc);s1.position.set(0,1.63,0);g.add(s1);
  const s2=new THREE.Mesh(new THREE.BoxGeometry(.7,.06,1.65),sc);s2.position.set(0,2.17,1.9);g.add(s2)}
 if(o.spo>0){const tall=o.spo===2,h=tall?1.7:.8,y=tall?3.4:2.6;
  const sp=new THREE.Mesh(new THREE.BoxGeometry(tall?4:3.4,.25,.9),M(0x111827));sp.position.set(0,y,-2.8);g.add(sp);
  [-1.2,1.2].forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(.2,h,.2),M(0x111827));s.position.set(x,1.7+h/2,-2.8);g.add(s)})}
 [[-1.7,1.9],[1.7,1.9],[-1.7,-1.9],[1.7,-1.9]].forEach(p=>{const w=new THREE.Mesh(wG,M(0x111111));w.rotation.z=Math.PI/2;w.position.set(p[0],.75,p[1]);g.add(w)});
 const seat=new THREE.Mesh(new THREE.BoxGeometry(1.3,1,.8),M(0x1f2937));seat.position.set(0,1.9,-.4);g.add(seat);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.65,10,10),M(skin));hd.position.set(0,2.9,-.3);g.add(hd);
 const hm=new THREE.Mesh(new THREE.SphereGeometry(.72,10,10,0,TAU,0,Math.PI/2),M(0xffffff));hm.position.set(0,3,-.3);g.add(hm);
 const gl=new THREE.Mesh(new THREE.BoxGeometry(1.2,.3,.2),M(0x000000));gl.position.set(0,2.95,.3);g.add(gl);
 if(o.glow){const u=new THREE.Mesh(new THREE.PlaneGeometry(5,8.2),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55}));u.rotation.x=-Math.PI/2;u.position.y=.12;g.add(u)}
 return g}
// obstacles
function mkCone(x,z){const g=new THREE.Group();
 if(Math.random()<.5){const c=new THREE.Mesh(new THREE.ConeGeometry(.9,2.4,10),M(0xf97316));c.position.y=1.3;g.add(c);
  const bs=new THREE.Mesh(new THREE.BoxGeometry(2,.2,2),M(0xffffff));bs.position.y=.1;g.add(bs)}
 else{const t=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,2,12),M(0x1f2937));t.position.y=1;g.add(t);
  const s=new THREE.Mesh(new THREE.CylinderGeometry(1.12,1.12,.5,12),M(0xfacc15));s.position.y=1;g.add(s)}
 g.position.set(x,0,z);scene.add(g);return {m:g,x,z,hit:0,vx:0,vy:0,vz:0}}
function mkPad(type,x,z){let m;
 if(type==='oil'){m=new THREE.Mesh(new THREE.CircleGeometry(4.5,20),new THREE.MeshBasicMaterial({color:0x1e1b4b}));m.scale.set(1.3,1,1)}
 else{m=new THREE.Mesh(new THREE.PlaneGeometry(6,7),new THREE.MeshBasicMaterial({color:0xfacc15}))}
 m.rotation.x=-Math.PI/2;m.position.set(x,.1,z);scene.add(m);
 if(type==='boost'){const ar=new THREE.Mesh(new THREE.ConeGeometry(2,3,3),new THREE.MeshBasicMaterial({color:0xea580c}));ar.rotation.x=Math.PI/2;ar.rotation.z=Math.PI;ar.position.set(x,.2,z);ar.userData.pad=1;scene.add(ar);return {m,ar,x,z,type}}
 return {m,x,z,type}}
function mkBlock(hay){const g=new THREE.Group();
 if(hay){const b=new THREE.Mesh(new THREE.BoxGeometry(4.5,2.4,3),M(0xd4a017));b.position.y=1.2;g.add(b);const s=new THREE.Mesh(new THREE.BoxGeometry(4.6,.3,3.1),M(0x92400e));s.position.y=1.2;g.add(s)}
 else{const b=new THREE.Mesh(new THREE.BoxGeometry(6,2.6,2),M(0xef4444));b.position.y=1.3;g.add(b);
  for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1,2.7,2.1),M(0xffffff));s.position.set(-2+i*2,1.3,0);g.add(s)}}
 scene.add(g);return g}
// smoke
const SM=[],smg=new THREE.SphereGeometry(.8,6,6);let si=0;
for(let i=0;i<60;i++){const m=new THREE.Mesh(smg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));m.visible=false;scene.add(m);SM.push({m,l:0})}
function puff(x,z){const s=SM[si++%SM.length];s.l=.9;s.m.position.set(x,.8,z);s.m.visible=true;s.m.scale.setScalar(.8)}
// state
const K={};let mode='menu',carI=0,lvI=0,unlocked=0,tut=false,tNow=0,cd=0,lastN=0,bnT=0,cheer=.3,shake=0,finT=0,doneT=0,camH=0;
let hits=0,braked=0,tl=0,tr=0,dsum=0,tstep=0,drift=0,gap=0,total=0,res=null,sl=0,oilT=0,padCD=0,yellowT=0;
const P={x:A,z:0,h:0,vx:0,vz:0,p:0,pt:0,m:null};
let AIs=[],cones=[],pads=[],movers=[];
const TS=[{t:'Press ⬆️ (or W) to GO!',ok:()=>Math.hypot(P.vx,P.vz)>20},
{t:'Steer with ⬅️ ➡️ (or A / D)',ok:()=>tl>.7&&tr>.7},
{t:'Hold SPACE + steer to DRIFT! 💨',ok:()=>dsum>80},
{t:'Cones are soft! Bonk one 🧡',ok:()=>hits>0},
{t:'Brake with ⬇️ (or S)',ok:()=>braked>.6},
{t:'🏆 You are a Drift Pro! 🏆',ok:()=>false}];
const ord=n=>['','1st','2nd','3rd'][n]||n+'th';
let AC,eng,engG,sq,sqG;
function ensureAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
 eng=AC.createOscillator();eng.type='sawtooth';engG=AC.createGain();engG.gain.value=0;const f=AC.createBiquadFilter();f.frequency.value=500;eng.connect(f);f.connect(engG);engG.connect(AC.destination);eng.start();
 sq=AC.createOscillator();sq.type='triangle';sqG=AC.createGain();sqG.gain.value=0;sq.connect(sqG);sqG.connect(AC.destination);sq.start();}catch(e){AC=null}}
function rs(){const w=G.clientWidth,h=G.clientHeight;if(!w||!h)return;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
 if(mode==='menu')cam.setViewOffset(w,h,w*.22,0,w,h);else cam.clearViewOffset()}
addEventListener('resize',rs);
addEventListener('keydown',e=>{K[e.code]=1;if(/Arrow|Space/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>{K[e.code]=0;if(/Arrow|Space/.test(e.code))e.preventDefault()});
addEventListener('click',()=>setTimeout(()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()},0));
function clearAll(){[...AIs,...cones,...movers].forEach(a=>scene.remove(a.m));pads.forEach(p=>{scene.remove(p.m);if(p.ar)scene.remove(p.ar)});AIs=[];cones=[];pads=[];movers=[]}
function setCar(){if(P.m)scene.remove(P.m);P.m=mkCar(CUST.col===null?CARS[carI].c:CUST.col,0xfcd9b6,CUST);scene.add(P.m)}
function prep(li){clearAll();const L=LV[li];buildTrack(li);scene.background=new THREE.Color(L.sky);scene.fog=new THREE.Fog(L.sky,160,600);grass.material.color.set(L.grass);
 setCar();Object.assign(P,{x:pt(0,1)[0],z:0,h:0,vx:0,vz:0,p:0,pt:0});P.m.position.set(P.x,0,0);camH=0;oilT=padCD=yellowT=0}
function menu(){mode='menu';tut=false;prep(lvI);hl.textContent=hr.textContent=tu.textContent=bn.textContent='';rs();drawMenu()}
function hex(c){return '#'+c.toString(16).padStart(6,'0')}
function drawMenu(){
 ov.style.display='flex';
 ov.innerHTML=`<div class="panel"><h1>🏎️ Captain Drift's Drifting</h1>
 <div class="cars">${CARS.map((c,i)=>`<button class="card ${i===carI?'sel':''}" onclick="pick(${i})">${c.e} ${c.n}<br>⚡${'⭐'.repeat(c.s)} 🛞${'⭐'.repeat(c.g)}</button>`).join('')}</div>
 <div class="row">🎨 ${PAL.map((c,i)=>`<button class="sw ${CUST.col===c?'sel':''}" style="background:${hex(c)}" onclick="cc(${i})"></button>`).join('')}</div>
 <div class="row"><button class="card chip" onclick="cs()">🪽 Spoiler: ${['None','Wing','Giant'][CUST.spo]}</button><button class="card chip" onclick="cst()">🏁 Stripe: ${STN[CUST.stripe]}</button><button class="card chip" onclick="cg()">✨ Glow: ${CUST.glow?'On':'Off'}</button></div>
 <div class="lvls">${LV.map((l,i)=>`<button class="lv ${i===lvI?'sel':''}" ${i>unlocked?'disabled':''} onclick="plv(${i})">${i+1}</button>`).join('')}</div>
 <p>${LV[lvI].n} · ${LV[lvI].laps} laps · ${LV[lvI].ai} rivals</p>
 <div class="row"><button class="btn sm" onclick="go(true)">🎓 Tutorial</button><button class="btn sm" onclick="go(false)">🏁 Race!</button></div>
 <p style="font-size:2.2vh">⬆️ go · ⬅️➡️ steer · SPACE drift · ⬇️ brake</p></div>`}
function refresh(){ensureAudio();setCar();P.m.position.set(P.x,0,P.z);drawMenu()}
function pick(i){carI=i;beep(500+i*150,120);refresh()}
function cc(i){CUST.col=PAL[i];beep(400+i*60,100);refresh()}
function cs(){CUST.spo=(CUST.spo+1)%3;beep(600,100);refresh()}
function cst(){CUST.stripe=(CUST.stripe+1)%4;beep(700,100);refresh()}
function cg(){CUST.glow=CUST.glow?0:1;beep(900,100);refresh()}
function plv(i){lvI=i;prep(i);drawMenu()}
function go(isTut){ensureAudio();tut=isTut;const li=isTut?0:lvI,L=LV[li];prep(li);
 hits=braked=tl=tr=dsum=tstep=drift=gap=0;finT=doneT=0;res=null;
 if(!isTut){for(let i=0;i<L.ai;i++){const k=i%2?1.09:.91,t=-.055*(i+1);
   const m=mkCar([0x10b981,0xa855f7,0xec4899,0xf97316,0x22d3ee][i%5],[0xfcd9b6,0xc68642,0x8d5524,0xe0ac69,0xfcd9b6][i%5],{stripe:(i+1)%4,spo:i%3,glow:i===2?1:0});scene.add(m);AIs.push({m,k,t,p:t,i,done:0})}}
 const rt=()=>.7+Math.random()*(TAU-1.4),S=isTut?{oil:1,boost:1,hay:1,mov:0}:L;
 const n=isTut?6:L.cones;
 for(let i=0;i<n;i++){const t=isTut?.9+i*.75:.6+(TAU-1.1)*(i+Math.random()*.6)/n,k=isTut?(i%2?1.07:.93):.86+Math.random()*.28,p=pt(t,k);cones.push(mkCone(p[0],p[1]))}
 for(let i=0;i<S.oil;i++){const p=pt(rt(),.9+Math.random()*.2);pads.push(mkPad('oil',p[0],p[1]))}
 for(let i=0;i<S.boost;i++){const p=pt(rt(),.95+Math.random()*.1);pads.push(mkPad('boost',p[0],p[1]))}
 for(let i=0;i<S.hay;i++){const t=rt(),k=.86+Math.random()*.28,p=pt(t,k),m=mkBlock(1);m.position.set(p[0],0,p[1]);m.rotation.y=Math.random()*3;movers.push({m,r:3.2,t,k0:k,amp:0,sp:0,ph:0})}
 for(let i=0;i<S.mov;i++){const t=rt(),m=mkBlock(0);movers.push({m,r:4,t,k0:1,amp:.14,sp:1+Math.random(),ph:Math.random()*6})}
 ov.style.display='none';ov.innerHTML='';rs();
 mode=isTut?'race':'count';cd=3.4;lastN=4;
 if(isTut){say('Tutorial time! 🎓');setBn('🟢',1)}else say('Level '+(li+1)+': '+L.n)}
function showRes(){let h;
 if(tut){h=`<h1>🎓 Tutorial complete!</h1><p>You are ready to race!</p><div class="row"><button class="btn sm" onclick="go(false)">🏁 Race!</button><button class="btn sm" onclick="go(true)">🔁 Again</button><button class="btn sm" onclick="menu()">🏠 Menu</button></div>`}
 else{const pl=res,ok=pl<=3,last=lvI>=LV.length-1;
  h=`<h1>${['','🥇','🥈','🥉'][pl]||'🏁'} ${ord(pl)} place!</h1><p>💨 Drift score: ${Math.floor(total)}</p>`+
   (ok?(last?`<p>🏆 You are the Drift Champion! 🏆</p>`:`<p>Level ${lvI+2} unlocked! 🔓</p>`):`<p>Finish in the top 3 to unlock the next level!</p>`)+
   `<div class="row"><button class="btn sm" onclick="go(false)">🔁 Again</button>${ok&&!last?`<button class="btn sm" onclick="nextL()">➡️ Next</button>`:''}<button class="btn sm" onclick="menu()">🏠 Menu</button></div>`}
 ov.innerHTML=`<div class="panel">${h}</div>`;ov.style.display='flex'}
function nextL(){lvI=Math.min(LV.length-1,lvI+1);go(false)}
function endRace(place){mode='done';doneT=1.6;res=place;confetti();say('🏁 Checkered flag!');tune(place<=3?[523,659,784,1047,1319]:[392,330,262]);
 if(place<=3&&!tut){unlocked=Math.max(unlocked,Math.min(LV.length-1,lvI+1));floaty(['🎉','👏','🏆','🏎️'])}}
function rank(){return 1+AIs.filter(a=>a.p>P.p).length}
function yellow(){if(yellowT<=0)say('🟡 Yellow flag! Careful!',1200);yellowT=2}
function stepP(dt){
 const C=CARS[carI],live=mode==='race';
 const up=live&&(K.ArrowUp||K.KeyW),dn=live&&(K.ArrowDown||K.KeyS),lf=live&&(K.ArrowLeft||K.KeyA),rt=live&&(K.ArrowRight||K.KeyD),hb=live&&K.Space;
 padCD-=dt;oilT-=dt;yellowT-=dt;
 let fx=Math.sin(P.h),fz=Math.cos(P.h);let vf=P.vx*fx+P.vz*fz;
 P.h+=((lf?1:0)-(rt?1:0))*(hb?2.7:1.9)*dt*Math.max(-1,Math.min(1,vf/12));
 fx=Math.sin(P.h);fz=Math.cos(P.h);const rx=-Math.cos(P.h),rz=Math.sin(P.h);
 vf=P.vx*fx+P.vz*fz;let vl=P.vx*rx+P.vz*rz;
 if(up)vf+=C.acc*dt*(1-Math.max(0,vf)/C.max);else vf*=Math.exp(-.3*dt);
 if(dn){vf-=45*dt;if(vf<-12)vf=-12;braked+=dt}
 if(hb)vf*=Math.exp(-.5*dt);
 const r=Math.hypot(P.x/A,P.z/B)/rho(Math.atan2(P.z/B,P.x/A)),on=r>.79&&r<1.21;
 if(!on){vf*=Math.exp(-1.5*dt);vl*=Math.exp(-1.5*dt);if(live)yellowT=Math.max(yellowT,.6)}
 vl*=Math.exp(-(hb?1.1:C.grip)*(oilT>0?.15:1)*dt);
 if(lf)tl+=dt;if(rt)tr+=dt;
 P.vx=fx*vf+rx*vl;P.vz=fz*vf+rz*vl;P.x+=P.vx*dt;P.z+=P.vz*dt;
 const r2=Math.hypot(P.x/A,P.z/B)/rho(Math.atan2(P.z/B,P.x/A));
 if(r2>1.215){const s=1.21/r2;P.x*=s;P.z*=s;P.vx*=-.25;P.vz*=-.25;shake=.5;beep(180,120,'square');yellow()}
 const spd=Math.hypot(P.vx,P.vz),slide=Math.abs(vl);sl=slide;
 const dr=slide>5&&spd>14&&on;
 if(dr){drift+=slide*dt*2;dsum+=slide*dt*2;gap=0;puff(P.x-fx*2+rx*1.6,P.z-fz*2+rz*1.6);puff(P.x-fx*2-rx*1.6,P.z-fz*2-rz*1.6)}
 else if(drift>0){gap+=dt;if(gap>.7){if(drift>60){say('+'+Math.floor(drift)+' drift! 💨');floaty(['👏','🎉']);beep(880,150);total+=drift}drift=0;gap=0}}
 const t=Math.atan2(P.z/B,P.x/A);let d=t-P.pt;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;P.p+=d;P.pt=t;
 for(const c of cones){if(c.hit)continue;const dx=P.x-c.x,dz=P.z-c.z;
  if(dx*dx+dz*dz<5.5){c.hit=1;c.vx=P.vx*1.1+(Math.random()-.5)*6;c.vz=P.vz*1.1+(Math.random()-.5)*6;c.vy=14;P.vx*=.6;P.vz*=.6;hits++;shake=.5;beep(160,150,'square');setBn('BONK!',.6)}}
 for(const q of pads){const dx=P.x-q.x,dz=P.z-q.z;if(dx*dx+dz*dz<(q.type==='oil'?20:16)){
  if(q.type==='oil'){if(oilT<=0){say('🛢️ Oil slick! Wheee!');beep(300,200,'sawtooth');yellow()}oilT=1.2}
  else if(padCD<=0){padCD=1;P.vx+=fx*20;P.vz+=fz*20;tune([600,800,1000]);shake=.3;setBn('BOOST! 🚀',.7)}}}
 for(const o of movers){const dx=P.x-o.m.position.x,dz=P.z-o.m.position.z,dd=Math.hypot(dx,dz);
  if(dd<o.r&&dd>.01){P.x+=dx/dd*(o.r-dd);P.z+=dz/dd*(o.r-dd);P.vx=P.vx*.3+dx/dd*8;P.vz=P.vz*.3+dz/dd*8;shake=.6;beep(140,160,'square');yellow()}}
 for(const a of AIs){const dx=P.x-a.m.position.x,dz=P.z-a.m.position.z,dd=Math.hypot(dx,dz);
  if(dd<3.8&&dd>.01){P.x+=dx/dd*(3.8-dd)*.6;P.z+=dz/dd*(3.8-dd)*.6;P.vx*=.97;P.vz*=.97;if(Math.random()<.1)beep(220,60,'square')}}
 P.m.position.set(P.x,0,P.z);P.m.rotation.y=P.h;P.m.rotation.z=-vl*.008;
 if(live&&!tut&&P.p>=LV[lvI].laps*TAU)endRace(rank());
 return dr}
function setBn(t,s){bn.textContent=t;bnT=s}
function aiPos(a){const p=pt(a.t,a.k),q=pt(a.t+.01,a.k);a.m.position.set(p[0],0,p[1]);a.m.rotation.y=Math.atan2(q[0]-p[0],q[1]-p[1]);return Math.hypot(q[0]-p[0],q[1]-p[1])/.01}
function stepAI(dt){const L=LV[tut?0:lvI];
 for(const a of AIs){const mag=aiPos(a);
  if(mode==='race'||mode==='done'){let rub=1;const df=a.p-P.p;if(df>.45)rub=.92;else if(df<-.3)rub=1.07;
   const sp=L.sp*rub*(1+.05*Math.sin(tNow*.7+a.i*2)),dt2=sp*dt/mag;
   a.t+=dt2;a.p+=dt2;if(!a.done&&a.p>=L.laps*TAU)a.done=1;aiPos(a)}}}
function stepMov(){for(const o of movers){if(o.amp){const p=pt(o.t,o.k0+o.amp*Math.sin(tNow*o.sp+o.ph));o.m.position.set(p[0],0,p[1])}}
 for(const q of pads)if(q.ar)q.ar.position.y=.3+Math.abs(Math.sin(tNow*4))*.4}
function stepCones(dt){for(const c of cones){if(!c.hit)continue;c.vy-=40*dt;c.m.position.x+=c.vx*dt;c.m.position.z+=c.vz*dt;c.m.position.y+=c.vy*dt;c.m.rotation.x+=7*dt;c.m.rotation.z+=5*dt;
 if(c.m.position.y<0){c.m.position.y=0;c.vy=0;c.vx*=.9;c.vz*=.9}}}
let W=0,H=0;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;
 if(G.clientWidth!==W||G.clientHeight!==H){W=G.clientWidth;H=G.clientHeight;rs()}
 let dr=false;
 if(mode==='count'){cd-=dt;const n=Math.ceil(cd);if(n!==lastN){lastN=n;if(n>0){setBn(String(n),1);beep(440,150,'square')}}
  if(cd<=0){mode='race';setBn('GO! 🟢',1);say('🟢 Green flag!',1200);beep(880,400,'square');tune([523,784,1047])}}
 if(mode!=='menu'){dr=stepP(dt)}
 stepAI(dt);stepCones(dt);stepMov();
 if(ref){const k=mode==='count'?'red':mode==='done'?'check':(mode==='race'&&yellowT>0)?'yellow':'green';setFlag(k);
  ref.arm.rotation.z=(k==='red'?.9:.5)+Math.sin(tNow*(k==='red'?2:9))*(k==='red'?.08:.5);ref.flag.rotation.y=Math.sin(tNow*11)*.25}
 if(mode==='done'){doneT-=dt;if(doneT<=0&&res!==null&&ov.style.display==='none'){showRes()}}
 if(tut&&mode==='race'){const s=TS[tstep];tu.textContent=s.t;
  if(tstep<TS.length-1){if(s.ok()){tstep++;beep(784,150);confetti();wiggle(tu,'bounce');if(tstep===TS.length-1)finT=3.5}}
  else{finT-=dt;if(finT<=0){endRace(1);res=1}}}
 else if(mode!=='menu'&&mode!=='done')tu.textContent='';
 if(bnT>0){bnT-=dt;if(bnT<=0)bn.textContent=''}
 if(mode==='menu'){hl.textContent=hr.textContent=''}
 else{const spd=Math.hypot(P.vx,P.vz);
  hl.textContent=tut?'🎓 Tutorial':`Level ${lvI+1}: ${LV[lvI].n}\nLap ${Math.min(LV[lvI].laps,Math.max(1,Math.floor(P.p/TAU)+1))}/${LV[lvI].laps}  🏁 ${ord(rank())} of ${AIs.length+1}`;
  hr.textContent=`${CARS[carI].n} · ${Math.round(spd*3.6)} km/h\n💨 Drift ${Math.floor(drift)}  ⭐ ${Math.floor(total)}`}
 for(const s of SM)if(s.l>0){s.l-=dt;s.m.scale.multiplyScalar(1+1.6*dt);s.m.position.y+=1.5*dt;s.m.material.opacity=Math.max(0,s.l/.9*.6);if(s.l<=0)s.m.visible=false}
 const target=.35+(dr?1.2:0)+(mode==='done'&&res<=3?1.8:0)+(mode==='race'?.3:0);cheer+=(target-cheer)*Math.min(1,3*dt);
 for(const c of crowd){c.g.position.y=c.y+Math.abs(Math.sin(tNow*5+c.ph))*cheer;c.ar.rotation.z=.4+Math.sin(tNow*8+c.ph)*cheer*.6}
 if(AC){const spd=Math.hypot(P.vx,P.vz);eng.frequency.value=50+spd*3.5;engG.gain.value=(mode==='race'||mode==='count'||mode==='done')?.045:0;
  sq.frequency.value=650+sl*15;sqG.gain.value=dr?.025:0}
 if(mode==='menu'){const a=tNow*.5;cam.position.set(P.x+Math.sin(a)*15,5,P.z+Math.cos(a)*15);cam.lookAt(P.x,1.5,P.z);cam.fov=60}
 else{let dh=P.h-camH;while(dh>Math.PI)dh-=TAU;while(dh<-Math.PI)dh+=TAU;camH+=dh*Math.min(1,3.5*dt);
  const spd=Math.hypot(P.vx,P.vz);shake=Math.max(0,shake-dt*1.5);
  const tx=P.x-Math.sin(camH)*15,tz=P.z-Math.cos(camH)*15;
  cam.position.x+=(tx-cam.position.x)*Math.min(1,9*dt);cam.position.y+=(8-cam.position.y)*Math.min(1,5*dt);cam.position.z+=(tz-cam.position.z)*Math.min(1,9*dt);
  cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;
  cam.lookAt(P.x+Math.sin(camH)*10,1.5,P.z+Math.cos(camH)*10);cam.fov=62+spd*.35}
 cam.updateProjectionMatrix();
 renderer.render(scene,cam)}
menu();
requestAnimationFrame(loop);

</script>
</body>
